name: Guardian tests

# Read-only CI for the repository automation. This workflow runs on the
# untrusted `pull_request` event, but it has no secrets and only `contents:
# read`; it never runs in the privileged `pull_request_target` context.
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/guardian.yml'
      - '.github/workflows/guardian-tests.yml'
      - '.github/workflows/contributor-bot.yml'
      - '.github/workflows/pr-assignment-bot.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/guardian.yml'
      - '.github/workflows/guardian-tests.yml'
      - '.github/workflows/contributor-bot.yml'
      - '.github/workflows/pr-assignment-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: guardian + bot tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run Guardian and bot tests
        run: |
          node --test \
            .github/scripts/contributor-bot.test.mjs \
            .github/scripts/pr-assignment-bot.test.mjs \
            .github/scripts/lib/*.test.mjs \
            .github/scripts/guardian/*.test.mjs
