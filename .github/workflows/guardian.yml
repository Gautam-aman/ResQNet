name: Guardian

# Guardian runs from the default branch only. pull_request_target and
# issue_comment provide a trusted context; no pull-request head code is checked
# out or executed. The workflow keeps write permissions to the minimum needed
# for one summary comment, one notification, and one advisory check run.

"on":
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issues:
    types: [assigned, unassigned]
  issue_comment:
    types: [created]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["Web", "Backend", "Java", "Android", "Android instrumented", "Guardian tests"]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number(s), comma separated. Empty evaluates open pull requests.'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write
  statuses: read

concurrency:
  group: guardian-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.check_suite.head_sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request != null &&
         startsWith(github.event.comment.body, '/guardian'))) &&
      (github.event_name != 'check_suite' ||
        github.event.check_suite.app.slug != 'github-actions')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Evaluate readiness
        env:
          GUARDIAN_TOKEN: ${{ github.token }}
          GUARDIAN_DRY_RUN: ${{ vars.GUARDIAN_DRY_RUN || 'true' }}
          GUARDIAN_NOTIFY: ${{ vars.GUARDIAN_NOTIFY || 'false' }}
          GUARDIAN_CHECK_RUN: ${{ vars.GUARDIAN_CHECK_RUN || 'true' }}
          GUARDIAN_AI_REVIEW: ${{ vars.GUARDIAN_AI_REVIEW || 'false' }}
          GUARDIAN_AI_REVIEW_LOGIN: ${{ vars.GUARDIAN_AI_REVIEW_LOGIN || 'coderabbitai[bot]' }}
          GUARDIAN_STALE_DAYS: ${{ vars.GUARDIAN_STALE_DAYS || '30' }}
          GUARDIAN_NO_CHECKS_GRACE_MINUTES: ${{ vars.GUARDIAN_NO_CHECKS_GRACE_MINUTES || '15' }}
          GUARDIAN_MAINTAINERS: ${{ vars.GUARDIAN_MAINTAINERS || 'Gautam-aman' }}
          GUARDIAN_BOT_LOGIN: ${{ vars.GUARDIAN_BOT_LOGIN || 'github-actions[bot]' }}
          GUARDIAN_MAX_PULLS: ${{ vars.GUARDIAN_MAX_PULLS || '25' }}
          GUARDIAN_MERGEABLE_RETRY_MS: ${{ vars.GUARDIAN_MERGEABLE_RETRY_MS || '800' }}
        run: node .github/scripts/guardian.mjs
