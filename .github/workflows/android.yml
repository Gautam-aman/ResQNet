name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'packages/mesh-core/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/mesh-core/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assemble + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The Gradle build lives in apps/android, not at the repository root, so
      # every Gradle step below runs from there.
      - uses: gradle/actions/setup-gradle@v6
        with:
          working-directory: apps/android

      # The app compiles mesh-core from source rather than consuming a jar,
      # so a mesh-core change that breaks the Android build is caught here
      # rather than at the next release. That is the point of this job: it is
      # the only automated check that mesh-core stays free of APIs the handset
      # does not have.
      - name: Unit and Robolectric tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble the debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble the release APK
        working-directory: apps/android
        # Release builds run the same lint and shrink checks a published build
        # would, so a signing or minification problem surfaces in CI.
        run: ./gradlew assembleRelease --stacktrace

      - name: Lint
        working-directory: apps/android
        run: ./gradlew lintDebug --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          retention-days: 14

      - name: Publish the unit test count
        # Reported rather than only logged, so a drop in coverage is visible in
        # the run summary instead of needing a report to be opened.
        # Makes the pass/fail visible in the job summary without having to
        # open a report, and makes a drop in coverage obvious on a diff.
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          total = failures = errors = 0
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              head = open(path, encoding='utf-8').read(600)
              m = re.search(r'tests="(\d+)"', head)
              if not m:
                  continue
              total += int(m.group(1))
              failures += int((re.search(r'failures="(\d+)"', head) or [0, 0])[1])
              errors += int((re.search(r'errors="(\d+)"', head) or [0, 0])[1])
          print(f"### Android\n\n{total} tests, {failures} failures, {errors} errors\n")
          PY
        working-directory: apps/android