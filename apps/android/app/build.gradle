plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.resqnet.android'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.resqnet.android'
        // Android 8.0. This is not arbitrary: java.util.Base64, which the
        // device identity needs to publish its public key, arrived in API 26.
        minSdk 26
        targetSdk 34
        // 2 because 0.1.0 shipped as the debug-signed internal build.
        versionCode 3
        // Mirrors the root pom.xml version. The release workflow checks the
        // two against each other, so the tag and the artifact can never
        // disagree. No Android binary is published in this release: physical
        // device networking has never been tested, so the source ships and
        // the APK waits. See apps/android/DEVICE_TESTING.md.
        versionName '0.2.0-beta'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // Unset by default, so a checkout with no keystore produces an
            // unsigned APK rather than something signed with a key that is in
            // the repository. See the signingConfigs block below.
        }
    }

    // ---------------------------------------------------------------- signing
    //
    // Signing material is never committed. The keystore path and its passwords
    // are read from Gradle properties, which a developer keeps in
    // ~/.gradle/gradle.properties and CI writes from repository secrets. When
    // they are absent the release build stays unsigned and says so, rather than
    // silently falling back to the debug key: an APK signed with the debug key
    // looks installable and must never reach a tester by accident.

    def keystoreFilePath = providers.gradleProperty('RESQNET_KEYSTORE_FILE').orNull
    def keystorePasswordValue = providers.gradleProperty('RESQNET_KEYSTORE_PASSWORD').orNull
    def keyAliasValue = providers.gradleProperty('RESQNET_KEY_ALIAS').orNull
    def keyPasswordValue = providers.gradleProperty('RESQNET_KEY_PASSWORD').orNull
    def hasReleaseSigning = keystoreFilePath && keystorePasswordValue
            && keyAliasValue && keyPasswordValue
            && file(keystoreFilePath).exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreFilePath)
                storePassword keystorePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        // Java 17 language level, matching what mesh-core is compiled with.
        // Records and switch expressions are desugared by D8.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Provides java.util.List.of / Map.copyOf / Set.of, which mesh-core uses
        // heavily and which the platform only provides from API 30.
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        main {
            // The routing engine is compiled from source rather than consumed as
            // a published artifact. This is the mechanism behind the project's
            // central claim: the handset cannot accidentally run a different
            // engine from the one the simulator and unit tests verify.
            java.srcDir rootProject.file('../../packages/mesh-core/src/main/java')
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        warningsAsErrors false
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Peer discovery and the byte pipe. Nearby Connections handles the radio
    // link only; multi-hop routing above it is ResQNet's own responsibility and
    // lives in mesh-core.
    implementation 'com.google.android.gms:play-services-nearby:19.5.1'

    // HPKE for directed messages. tink-android keeps the implementation
    // Android-compatible and ships its own protobuf-lite classes; mesh-core's
    // Maven build uses the pure-Java artifact with the same API.
    implementation 'com.google.crypto.tink:tink-android:1.24.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.5.0'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // RecyclerViewActions (Home quick actions are rows in a RecyclerView).
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
    // Only where a test must reach outside the app's own window, e.g. the
    // system permission dialog. Everything else uses Espresso against our own
    // view hierarchy, because a UiAutomator selector is a string that rots
    // silently when someone renames a button.
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}